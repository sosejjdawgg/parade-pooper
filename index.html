<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meadow Well Animatic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#eee;--accent:#e3261c;--ui:rgba(12,10,10,.78);--line:#444}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:'Courier Prime',monospace}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;cursor:pointer;background:#000}
#ui{position:fixed;left:0;right:0;bottom:0;padding:10px 16px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  background:linear-gradient(transparent,rgba(0,0,0,.9));opacity:0;transition:opacity .4s;pointer-events:none}
body.show #ui{opacity:1;pointer-events:auto}
#bar{flex:1 1 100%;height:5px;background:#2a2a2a;cursor:pointer;position:relative}
#fill{height:100%;width:0;background:var(--accent)}
button{font:700 11px 'Courier Prime',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);
  background:var(--ui);border:1px solid var(--line);padding:7px 10px;cursor:pointer}
button.on{border-color:var(--accent);background:#3a0d0a;color:#fff}
#time{margin-left:auto;font-size:11px;opacity:.7}
</style>
</head>
<body class="show">
<canvas id="c"></canvas>
<div id="ui">
  <div id="bar"><div id="fill"></div></div>
  <button id="play">Pause</button>
  <button id="snd">Sound: off</button>
  <span id="chaps"></span>
  <span id="time"></span>
</div>
<script>
'use strict';
// ───────────────────────── core ─────────────────────────
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=1080,H=1920,DPR=1,VIG=null,NOISE=null;
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const EXPORT=new URLSearchParams(location.search).has('export'),R=EXPORT?seeded(1991):Math.random,rand=(a,b)=>a+R()*(b-a),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k;
const easeIn=k=>k*k*k,easeOut=k=>1-Math.pow(1-k,3),ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const sm=(a,b,v)=>{const k=clamp((v-a)/(b-a));return k*k*(3-2*k)};
const ANTON='Anton, Impact, "Arial Narrow", sans-serif',COURIER='"Courier Prime", "Courier New", monospace';

function resize(){
  // fixed 9:16 portrait stage (TikTok 1080x1920), scaled to fit the window
  DPR=1;W=1080;H=1920;cv.width=W;cv.height=H;
  const fit=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*fit+'px';cv.style.height=H*fit+'px';
  VIG=document.createElement('canvas');VIG.width=W;VIG.height=H;
  const v=VIG.getContext('2d'),g=v.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.hypot(W,H)*.62);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.72)');v.fillStyle=g;v.fillRect(0,0,W,H);
  cur=-1;
}
addEventListener('resize',resize);

// ───────────────────────── sprites ─────────────────────────
function glow(r,g,b,size=128){
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),h=size/2;
  const gr=x.createRadialGradient(h,h,0,h,h,h);
  gr.addColorStop(0,`rgba(${r},${g},${b},1)`);gr.addColorStop(.22,`rgba(${r},${g},${b},.55)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle=gr;x.fillRect(0,0,size,size);return c;
}
function cloud(r,g,b,seed,size=180){
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),h=size/2,rr=seeded(seed);
  for(let i=0;i<26;i++){
    const a=rr()*6.283,d=rr()*h*.48,px=h+Math.cos(a)*d,py=h+Math.sin(a)*d,s=h*(.22+rr()*.38),al=.16+rr()*.26;
    const gr=x.createRadialGradient(px,py,0,px,py,s);
    gr.addColorStop(0,`rgba(${r},${g},${b},${al})`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
    x.fillStyle=gr;x.fillRect(0,0,size,size);
  }
  x.globalCompositeOperation='destination-in';
  const m=x.createRadialGradient(h,h,h*.25,h,h,h);m.addColorStop(0,'#000');m.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=m;x.fillRect(0,0,size,size);return c;
}
const SPR={
  smoke:[0,1,2,3].map(i=>cloud(28,22,24,11+i)),
  lit:[0,1,2,3].map(i=>cloud(255,115,35,31+i)),
  dust:[0,1,2,3].map(i=>cloud(168,162,154,51+i)),
  sun:[0,1,2,3].map(i=>cloud(255,236,210,71+i)),
  white:glow(255,255,255),fy:glow(255,214,120),fr:glow(255,78,18),
  blue:glow(60,120,255),red:glow(255,30,30),orange:glow(255,140,45),amber:glow(255,170,60)
};
NOISE=(()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),d=x.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){const v=R()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);return c})();

function G(spr,x,y,s,a=1){if(a<=0.003)return;ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(1,a);
  ctx.drawImage(spr,x-s/2,y-s/2,s,s);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}

// ───────────────────────── particles ─────────────────────────
let smoke=[],fire=[],sparks=[],wind=0;
function emit(rate,dt,fn){let n=rate*dt;while(n>1){fn();n--}if(R()<n)fn()}
function addSmoke(x,y,o={}){
  if(smoke.length>440)smoke.shift();const s=o.s||1;
  smoke.push({x:x+rand(-8,8)*s,y,vx:(o.vx||0)+rand(-14,14)*s,vy:(o.vy??-40)*s*rand(.7,1.3),r:rand(18,32)*s,gr:(o.gr||28)*s*rand(.7,1.3),
    life:(o.life||5)*rand(.75,1.2),age:0,a:(o.a||.55)*rand(.7,1),rot:rand(0,6.28),vr:rand(-.35,.35),k:(R()*4)|0,dust:!!o.dust,lit:o.lit??1})
}
function addFire(x,y,s=1,o={}){
  if(fire.length>760)fire.shift();
  fire.push({x:x+rand(-10,10)*s,y:y+rand(-4,4)*s,vx:(o.vx||0)+rand(-18,18)*s,vy:-rand(60,140)*s,r:rand(10,24)*s,life:rand(.35,.85)*(o.life||1),age:0})
}
function addSpark(x,y,o={}){
  if(sparks.length>1000)sparks.shift();const a=o.a??rand(0,6.283),v=(o.v||300)*rand(.3,1);
  sparks.push({x,y,vx:Math.cos(a)*v+(o.vx||0),vy:Math.sin(a)*v+(o.vy||0),life:(o.life||.8)*rand(.5,1.2),age:0,g:o.g??400,
    c:o.c||'255,200,120',w:o.w||1.5,dark:!!o.dark,drag:o.drag??.5})
}
function stepParticles(dt){
  if(!dt)return;
  for(const p of smoke){p.age+=dt;p.vx+=wind*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy*=1-.12*dt;p.r+=p.gr*dt;p.rot+=p.vr*dt}
  for(const p of fire){p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx+=wind*.5*dt}
  for(const p of sparks){p.age+=dt;p.vy+=p.g*dt;p.vx*=1-p.drag*dt;p.vy*=1-p.drag*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
  smoke=smoke.filter(p=>p.age<p.life);fire=fire.filter(p=>p.age<p.life);sparks=sparks.filter(p=>p.age<p.life);
}
function drawSmoke(){
  for(const p of smoke){
    const k=p.age/p.life,al=p.a*sm(0,.1,k)*(1-sm(.45,1,k));if(al<=0)continue;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.globalAlpha=al;ctx.drawImage((p.dust?SPR.dust:SPR.smoke)[p.k],-p.r,-p.r,p.r*2,p.r*2);
    const la=al*p.lit*(p.dust?.35:Math.pow(1-k,2)*.85);
    if(la>.01){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=la;ctx.drawImage((p.dust?SPR.sun:SPR.lit)[p.k],-p.r,-p.r*1.05,p.r*2,p.r*2)}
    ctx.restore();
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function drawFire(){
  ctx.globalCompositeOperation='lighter';
  for(const p of fire){
    const k=p.age/p.life,s=p.r*(1-k*.45);
    ctx.globalAlpha=Math.pow(1-k,1.6)*.85;ctx.drawImage(SPR.fy,p.x-s*.7,p.y-s*.7,s*1.4,s*1.4);
    ctx.globalAlpha=(1-k)*.6;ctx.drawImage(SPR.fr,p.x-s*1.4,p.y-s*1.6,s*2.8,s*2.8);
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function drawSparks(){
  ctx.lineCap='round';
  for(const p of sparks){
    const k=p.age/p.life;ctx.globalCompositeOperation=p.dark?'source-over':'lighter';
    ctx.strokeStyle=p.dark?`rgba(12,8,8,${1-k*.5})`:`rgba(${p.c},${1-k})`;ctx.lineWidth=p.w;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.025,p.y-p.vy*.025);ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
}
function drawFX(){drawSmoke();drawFire();drawSparks()}

// ───────────────────────── impact frames ─────────────────────────
let impacts=[],shake=0;
function impact(x,y,p=1,full=true){impacts.push({x,y,p,full,t:0});shake=Math.max(shake,p*(full?30:12));sfx(full?'boom':'thud',p)}
function spikes(x,y,n,rIn,rOut){
  ctx.beginPath();
  for(let i=0;i<n;i++){const a=R()*6.283,w=rand(.006,.03),r0=rIn*rand(.6,1.4);
    ctx.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0);ctx.lineTo(x+Math.cos(a-w)*rOut,y+Math.sin(a-w)*rOut);ctx.lineTo(x+Math.cos(a+w)*rOut,y+Math.sin(a+w)*rOut)}
  ctx.fill();
}
function drawImpacts(dt){
  const D=Math.hypot(W,H);
  for(const im of impacts){
    im.t+=dt;const t=im.t;
    if(im.full){
      if(t<.05){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H)}
      else if(t<.34){
        const odd=((t/.055)|0)%2;
        ctx.globalCompositeOperation='difference';ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
        ctx.globalCompositeOperation='saturation';ctx.fillStyle='#777';ctx.fillRect(0,0,W,H);
        if(odd){ctx.globalCompositeOperation='multiply';ctx.fillStyle='#ff3424';ctx.fillRect(0,0,W,H)}
        ctx.globalCompositeOperation='source-over';ctx.fillStyle=odd?'#000':'#fff';spikes(im.x,im.y,80,D*.1,D);
      }
    }else if(t<.16){ctx.fillStyle='rgba(255,255,255,.85)';spikes(im.x,im.y,26,D*.03*im.p,D*.25*im.p)}
    const a=1-clamp(t/.9);
    if(a>0){
      G(SPR.white,im.x,im.y,D*(im.full?1.4:.5)*im.p*(1+t),a*a*(im.full?.9:.7));
      ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`rgba(255,240,220,${a*.8})`;ctx.lineWidth=2+a*14*im.p;
      ctx.beginPath();ctx.arc(im.x,im.y,easeOut(clamp(t/.9))*D*.55*im.p,0,6.283);ctx.stroke();ctx.globalCompositeOperation='source-over';
    }
  }
  impacts=impacts.filter(i=>i.t<1);
}
function speedLines(cx,cy,I,col,rMin=.18){
  if(I<=.01)return;const D=Math.hypot(W,H),n=(I*110)|0;
  ctx.strokeStyle=`rgba(${col},${Math.min(1,.25+I*.4)})`;ctx.lineCap='round';
  for(let i=0;i<n;i++){const a=R()*6.283,r0=D*rand(rMin,.6),r1=r0+D*rand(.08,.45);ctx.lineWidth=rand(.6,2.8);
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);ctx.stroke()}
}
function whipLines(I,dir=1){ // horizontal motion-blur streaks for whip pans
  if(I<=.01)return;ctx.fillStyle=`rgba(255,255,255,${.08+I*.25})`;
  for(let i=0;i<I*90;i++){const y=R()*H,h=rand(1,I*14),x=R()*W*1.2-W*.1;ctx.fillRect(x,y,rand(W*.2,W*.9)*dir,h)}
}

// ───────────────────────── sound (synth, optional) ─────────────────────────
let AC=null,soundOn=false;
function sfx(kind,p=1){
  if(!soundOn||!AC)return;const t=AC.currentTime,g=AC.createGain();g.connect(AC.destination);
  if(kind==='whoosh'||kind==='snap'){
    const len=kind==='snap'?.12:.35,b=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(R()*2-1)*Math.pow(1-i/d.length,kind==='snap'?6:1.5);
    const s=AC.createBufferSource(),f=AC.createBiquadFilter();s.buffer=b;f.type='bandpass';f.Q.value=1.2;
    f.frequency.setValueAtTime(kind==='snap'?2600:400,t);f.frequency.exponentialRampToValueAtTime(kind==='snap'?900:3200,t+len);
    s.connect(f);f.connect(g);g.gain.value=kind==='snap'?.5:.35;s.start(t);
  }else{
    const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(kind==='boom'?110:160,t);o.frequency.exponentialRampToValueAtTime(30,t+.6);
    g.gain.setValueAtTime(.7*p,t);g.gain.exponentialRampToValueAtTime(.001,t+(kind==='boom'?1.2:.4));o.connect(g);o.start(t);o.stop(t+1.3);
    if(kind==='boom')sfx('whoosh');
  }
}

// ───────────────────────── shared drawing bits ─────────────────────────
function sky(c1,c2,y1=H){const g=ctx.createLinearGradient(0,0,0,y1);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(-W,-H,W*3,H*3)}
function pylon(x,yb,h,w){
  ctx.beginPath();ctx.moveTo(x-w/2,yb);ctx.lineTo(x-w*.12,yb-h);ctx.moveTo(x+w/2,yb);ctx.lineTo(x+w*.12,yb-h);
  for(let i=0;i<6;i++){const k0=i/6,k1=(i+1)/6,y0=yb-h*k0,y1=yb-h*k1,a0=lerp(w/2,w*.12,k0),a1=lerp(w/2,w*.12,k1);
    ctx.moveTo(x-a0,y0);ctx.lineTo(x+a1,y1);ctx.moveTo(x+a0,y0);ctx.lineTo(x-a1,y1)}
  ctx.moveTo(x-w*.7,yb-h*.92);ctx.lineTo(x+w*.7,yb-h*.92);ctx.stroke();
}
function figure(x,by,h,t,ph,col,armUp){ // hooded silhouette
  const bob=Math.sin(t*3+ph)*h*.02;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x-h*.3,by);ctx.lineTo(x-h*.26,by-h*.42+bob);ctx.quadraticCurveTo(x,by-h*.52+bob,x+h*.26,by-h*.42+bob);ctx.lineTo(x+h*.3,by);ctx.fill();
  ctx.beginPath();ctx.ellipse(x,by-h*.6+bob,h*.15,h*.17,0,0,6.283);ctx.fill();
  if(armUp){ctx.strokeStyle=col;ctx.lineWidth=h*.09;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+h*.2,by-h*.42+bob);ctx.lineTo(x+h*.3,by-h*1.0+bob);ctx.stroke();
    ctx.fillRect(x+h*.24,by-h*1.1+bob,h*.14,h*.08)}
  ctx.strokeStyle='rgba(255,120,40,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(x,by-h*.6+bob,h*.15,h*.17,0,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
}
function bigText(txt,size,x,y,fill,o={}){
  ctx.save();ctx.translate(x,y);if(o.skew)ctx.transform(1,0,o.skew,1,0,0);if(o.scale)ctx.scale(o.scale,o.scale);
  ctx.font=`${size}px ${ANTON}`;ctx.textAlign='center';ctx.textBaseline='middle';
  if(o.ab){ctx.globalAlpha=(o.alpha??1)*.45;ctx.fillStyle='#00c8ff';ctx.fillText(txt,-size*.03,0)}
  ctx.globalAlpha=o.alpha??1;if(o.stroke){ctx.lineWidth=size*.05;ctx.strokeStyle=o.stroke;ctx.strokeText(txt,0,0)}
  ctx.fillStyle=fill;ctx.fillText(txt,0,0);ctx.restore();
}

// ───────────────────────── scenes ─────────────────────────
const scenes=[];const S=o=>scenes.push(o);

// ── Shaun-of-the-Dead style snap montage ──
// Rapid extreme close-ups, each punched in with a whoosh, separated by single white frames, ending in a whip pan.
function montage(label,frames,o={}){
  const fd=o.fd||.42;
  return{name:label,dur:frames.length*fd+(o.tail||.5),trans:true,init(){this.last=-1;this.bg=o.bg||'#0a0607'},
    draw(t,dt){
      const i=Math.min(frames.length-1,(t/fd)|0),u=(t-i*fd)/fd,u2=t-frames.length*fd;
      if(i!==this.last&&u2<0){this.last=i;sfx('snap')}
      if(u2<0){
        const col=frames[i].bg||this.bg;ctx.fillStyle=col;ctx.fillRect(0,0,W,H);
        const punch=1+.35*Math.pow(1-clamp(u/.22),3),cx=W/2,cy=H/2,M=Math.min(W,H);
        ctx.save();ctx.translate(cx,cy);ctx.scale(punch,punch);ctx.rotate((i%2?1:-1)*.04*(1-clamp(u/.25)));
        frames[i].d(u,M,t);ctx.restore();
        speedLines(cx,cy,(1-clamp(u/.3))*1.1,'255,255,255',.28);
        const stripe=(i%2?-1:1);whipLines((1-clamp(u/.18))*1.2,stripe);
        if(u<.07){ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(0,0,W,H)}
        if(frames[i].cap){ctx.font=`700 ${M*.035}px ${COURIER}`;ctx.fillStyle='rgba(255,255,255,.75)';ctx.textAlign='center';ctx.fillText(frames[i].cap,W/2,H*.82)}
      }else{ // whip pan out
        if(u2<.03)sfx('whoosh');
        const k=clamp(u2/(o.tail||.5));ctx.fillStyle=this.bg;ctx.fillRect(0,0,W,H);
        ctx.save();ctx.translate(-easeIn(k)*W*1.6,0);frames[frames.length-1].d(1,Math.min(W,H),t,true);ctx.restore();
        whipLines(1.4,-1);ctx.fillStyle=`rgba(0,0,0,${easeIn(k)})`;ctx.fillRect(0,0,W,H);
      }
    }};
}
// close-up props for montages (drawn centred at 0,0, M = min(W,H))
const CU={
  key:{cap:'',d(u,M){ctx.translate(0,0);ctx.fillStyle='#16161a';ctx.beginPath();ctx.arc(0,0,M*.32,0,6.283);ctx.fill();
    ctx.strokeStyle='#5a5a62';ctx.lineWidth=M*.02;ctx.stroke();ctx.fillStyle='#08080a';ctx.beginPath();ctx.arc(0,0,M*.08,0,6.283);ctx.fill();
    ctx.rotate(-.9+easeOut(clamp(u*2.5))*.9);ctx.fillStyle='#b9b2a2';ctx.fillRect(-M*.02,-M*.02,M*.3,M*.04);
    ctx.fillStyle='#d6cfbf';ctx.beginPath();ctx.ellipse(M*.34,0,M*.1,M*.07,0,0,6.283);ctx.fill();ctx.fillStyle='#16161a';ctx.beginPath();ctx.arc(M*.38,0,M*.022,0,6.283);ctx.fill();
    G(SPR.amber,-M*.22,-M*.2,M*.16,clamp(u*3-.6))}},
  pedal:{d(u,M){const p=easeOut(clamp(u*3));ctx.fillStyle='#0b0b0d';ctx.fillRect(-M*.6,-M*.6,M*1.2,M*1.2);
    ctx.save();ctx.translate(0,p*M*.08);ctx.fillStyle='#2a2a2e';ctx.fillRect(-M*.14,-M*.2,M*.28,M*.4);ctx.strokeStyle='#45454c';ctx.lineWidth=M*.012;
    for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(-M*.12,i*M*.05);ctx.lineTo(M*.12,i*M*.05);ctx.stroke()}ctx.restore();
    ctx.fillStyle='#e9e5dc';ctx.beginPath();ctx.ellipse(M*.02,-M*.34+p*M*.24,M*.2,M*.11,-.2,0,6.283);ctx.fill();
    ctx.fillStyle='#c9301f';ctx.fillRect(-M*.18,-M*.34+p*M*.24,M*.38,M*.03)}},
  gear:{d(u,M){const p=easeOut(clamp(u*3.2));ctx.strokeStyle='#1a1a1d';ctx.lineWidth=M*.06;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,M*.45);ctx.lineTo(lerp(-M*.18,M*.12,p),lerp(-M*.05,-M*.15,p));ctx.stroke();

      ctx.fillRect(b.x+b.w*.7,y-b.h*.36,b.w*.08,b.h*.2);
      for(let i=0;i<b.win;i++){ctx.fillStyle=`rgba(255,110,40,${.12+.1*Math.sin(t*9+b.x+i)})`;ctx.fillRect(b.x+b.w*(i+.3)/b.win,y+b.h*.25,b.w*.4/b.win,b.h*.22);ctx.fillStyle='#080304'}}

// ───────────────────────── post, cues, timeline ─────────────────────────
function barH(){return 0} // no letterbox in portrait; text sits inside TikTok safe zones instead
const SAFE_TOP=H*.1,SAFE_BOTTOM=H*.74,SAFE_W=W*.78;
function wrap(txt,maxW){const words=txt.split(' '),out=[];let line='';for(const w of words){const tt=line?line+' '+w:w;if(ctx.measureText(tt).width>maxW&&line){out.push(line);line=w}else line=tt}out.push(line);return out}

  ctx.fillStyle=ctx.createPattern(NOISE,'repeat');ctx.save();ctx.translate(-ox,-oy);ctx.fillRect(0,0,W+160,H+160);ctx.restore();
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.drawImage(VIG,0,0,W,H);

}

    else if(c.k==='line'||c.k==='act'){ctx.font=c.k==='act'?`italic ${fl*.85}px ${COURIER}`:`${fl}px ${COURIER}`;ctx.textAlign='center';ctx.textBaseline='alphabetic';
      const lines=wrap(c.x,SAFE_W),lh=fl*1.25;let y=SAFE_BOTTOM-(lines.length-1)*lh;
      if(c.k==='line'){ctx.font=`700 ${fl*.72}px ${COURIER}`;ctx.fillStyle='#ff4a3a';ctx.fillText(c.w,W/2,y-lh);ctx.font=`${fl}px ${COURIER}`}
      ctx.fillStyle=c.k==='act'?'#d8d1c4':'#fff';for(const l of lines){ctx.fillText(l,W/2,y);y+=lh}}
    else if(c.k==='big'){ctx.shadowBlur=0;bigText(c.x,Math.min(W*.2,H*.3),W/2,H/2,'#e3261c',{skew:-.18,stroke:'#fff',scale:1+.15*(1-clamp((t-c.a)/.2)),alpha:ctx.globalAlpha})}
    ctx.shadowBlur=0;ctx.globalAlpha=1}

const starts=[];let total=0;for(const s of scenes){starts.push(total);total+=s.dur}

function seek(t){T=clamp(t,0,total-.001);cur=-1}
window.__seek=seek;
function render(dt){
  T+=dt;if(T>=total)T=0;
  const[i,t]=sceneAt(T);if(i!==cur){cur=i;smoke=[];fire=[];sparks=[];impacts=[];wind=0;const s=scenes[i];if(s.init)s.init()}

// ───────────────────────── UI ─────────────────────────
const $=id=>document.getElementById(id),chapBtns=[];

  const b=document.createElement('button');b.textContent=s.chapter;b.dataset.c=s.chapter;
  const st=Math.max(0,starts[i]-(scenes[i-1]&&scenes[i-1].trans?scenes[i-1].dur:0));b.onclick=e=>{e.stopPropagation();seek(st)};$('chaps').appendChild(b);chapBtns.push(b)}

$('snd').onclick=e=>{e.stopPropagation();soundOn=!soundOn;if(soundOn&&!AC)AC=new(window.AudioContext||window.webkitAudioContext)();$('snd').textContent='Sound: '+(soundOn?'on':'off')};

resize();if(EXPORT){document.getElementById('ui').remove();document.body.classList.remove('show')}else requestAnimationFrame(frame);
</script>
